<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F2747">
    <title>SniperPOS — Offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #F1F5F9;
            color: #0F2747;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top right, rgba(229, 9, 20, 0.08), transparent 32rem),
                #F1F5F9;
        }

        main {
            width: min(100%, 520px);
            padding: 32px;
            border: 1px solid #E2E8F0;
            border-radius: 20px;
            background: #FFFFFF;
            box-shadow: 0 18px 50px rgba(15, 39, 71, 0.10);
            text-align: center;
        }

        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: #0F2747;
            color: #FFFFFF;
            font-weight: 800;
            font-size: 21px;
            letter-spacing: -0.04em;
        }

        .accent { color: #E50914; }
        h1 { margin: 0; font-size: clamp(28px, 7vw, 38px); line-height: 1.1; }
        p { margin: 14px auto 0; max-width: 400px; color: #64748B; line-height: 1.65; }

        button {
            margin-top: 24px;
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            padding: 12px 18px;
            background: #E50914;
            color: #FFFFFF;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:focus-visible { outline: 3px solid rgba(229, 9, 20, 0.25); outline-offset: 3px; }
        small { display: block; margin-top: 18px; color: #94A3B8; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">SP</div>
        <h1>Sniper<span class="accent">POS</span> is offline</h1>
        <p>Your connection is currently unavailable. For security, sales, reports, receipts, and other authenticated business pages are not stored for offline viewing.</p>
        <button type="button" onclick="window.location.reload()">Try Again</button>
        <small>Precision in Every Sale.</small>
    </main>
</body>
</html>
